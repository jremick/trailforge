name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Lint, Offline Unit & PostGIS Integration Tests
    runs-on: ubuntu-latest

    services:
      postgis:
        image: imresamu/postgis:16-3.4
        env:
          POSTGRES_DB: trailforge
          POSTGRES_USER: trailforge
          POSTGRES_PASSWORD: trailforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U trailforge -d trailforge"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    env:
      DATABASE_URL: postgresql+psycopg://trailforge:trailforge@localhost:5432/trailforge
      TEST_DATABASE_URL: postgresql+psycopg://trailforge:trailforge@localhost:5432/trailforge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Lint with ruff
        run: uv run ruff check src tests migrations

      - name: Run Alembic migrations against PostGIS
        run: uv run alembic upgrade head

      - name: Run offline unit and PostGIS integration tests
        run: uv run pytest -m "not live" -v

  web:
    name: Web PWA Typecheck, Build & Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Build SEP-1865 MCP App bundle
        run: npm run build:mcp

      - name: Run Vitest offline unit tests
        run: npm test
