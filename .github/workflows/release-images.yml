name: Release Multi-Arch Images (GHCR)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional Git semver tag to build and publish (e.g. v1.0.0-beta.1 or v1.0.0)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  resolve-tag:
    name: Resolve Release Tag & Semver Channel
    permissions: {}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      minor: ${{ steps.resolve.outputs.minor }}
      is_stable: ${{ steps.resolve.outputs.is_stable }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
    steps:
      - name: Resolve release tag and guard latest for stable semver only
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -z "${INPUT_TAG}" ]; then
            TAG="sha-${GITHUB_SHA::7}"
            MINOR=""
            IS_STABLE="false"
            CHECKOUT_REF=""
          else
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              TAG="${INPUT_TAG}"
            else
              TAG="${GITHUB_REF_NAME}"
            fi

            if [[ ! "${TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid semver tag: ${TAG} (expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease)" >&2
              exit 1
            fi

            MINOR="v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            # Pre-release tags (e.g. v1.0.0-beta.1) MUST NOT overwrite :latest or :vMAJOR.MINOR
            if [[ -z "${BASH_REMATCH[4]}" ]]; then
              IS_STABLE="true"
            else
              IS_STABLE="false"
            fi
            CHECKOUT_REF="${TAG}"
          fi

          {
            echo "tag=${TAG}"
            echo "minor=${MINOR}"
            echo "is_stable=${IS_STABLE}"
            echo "checkout_ref=${CHECKOUT_REF}"
          } >> "${GITHUB_OUTPUT}"

  build-backend:
    name: Build & Push Backend Image (linux/amd64, linux/arm64)
    needs: resolve-tag
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-tag.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & OCI labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/trailforge-backend
          tags: |
            type=raw,value=${{ needs.resolve-tag.outputs.tag }}
            type=raw,value=${{ needs.resolve-tag.outputs.minor }},enable=${{ needs.resolve-tag.outputs.is_stable }}
            type=raw,value=latest,enable=${{ needs.resolve-tag.outputs.is_stable }}
          labels: |
            org.opencontainers.image.title=TrailForge Backend
            org.opencontainers.image.description=Open-source, self-hostable 4WD & off-road mapping, live track-grading, and trail-intelligence API & GIS worker (FastAPI + PostGIS + GDAL + tippecanoe + osmium + pmtiles)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve-tag.outputs.tag }}
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push multi-arch backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            INSTALL_DEV=false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=trailforge-backend
          cache-to: type=gha,mode=max,scope=trailforge-backend

  build-web:
    name: Build & Push Web PWA Image (linux/amd64, linux/arm64)
    needs: resolve-tag
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-tag.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & OCI labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/trailforge-web
          tags: |
            type=raw,value=${{ needs.resolve-tag.outputs.tag }}
            type=raw,value=${{ needs.resolve-tag.outputs.minor }},enable=${{ needs.resolve-tag.outputs.is_stable }}
            type=raw,value=latest,enable=${{ needs.resolve-tag.outputs.is_stable }}
          labels: |
            org.opencontainers.image.title=TrailForge Web PWA
            org.opencontainers.image.description=Offline-capable MapLibre GL JS 6 4WD trail intelligence & in-cab breadcrumb recorder PWA served via unprivileged Nginx with Range-safe PMTiles proxying
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve-tag.outputs.tag }}
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push multi-arch web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=trailforge-web
          cache-to: type=gha,mode=max,scope=trailforge-web

  deploy-railway:
    name: Trigger Railway Production Redeploy (Optional)
    needs: [resolve-tag, build-backend]
    if: ${{ needs.resolve-tag.outputs.is_stable == 'true' }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Install pinned Railway CLI (checksum-verified, no secrets in env)
        env:
          RAILWAY_CLI_VERSION: v5.76.0
          RAILWAY_CLI_SHA256: d479d0fd9a6a03a9c32780608245f3a3eba8c727ec02b0e5130a871128a75afd
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/railway.tar.gz"
          url="https://github.com/railwayapp/cli/releases/download/${RAILWAY_CLI_VERSION}/railway-${RAILWAY_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "${url}" -o "${archive}"
          printf '%s  %s\n' "${RAILWAY_CLI_SHA256}" "${archive}" | sha256sum -c -
          mkdir -p "${HOME}/.local/bin"
          tar -xzf "${archive}" -C "${HOME}/.local/bin" railway
          chmod 0755 "${HOME}/.local/bin/railway"
          rm -f "${archive}"

      - name: Redeploy Railway backend services from latest GHCR image
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICES: ${{ vars.RAILWAY_SERVICES || 'api worker' }}
        run: |
          set -euo pipefail
          set -f
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "RAILWAY_TOKEN secret is not configured; skipping automatic Railway redeploy."
            exit 0
          fi

          export PATH="${HOME}/.local/bin:/usr/local/bin:${PATH}"

          # Parse comma/whitespace-separated service names safely without glob expansion
          IFS=', ' read -r -a services <<< "${RAILWAY_SERVICES}"
          for svc in "${services[@]}"; do
            [ -n "${svc}" ] || continue
            echo "Triggering Railway redeploy from latest image for service: ${svc}"
            railway redeploy --service "${svc}" --from-source --yes
          done
